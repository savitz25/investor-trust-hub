name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_NAME: InvestorTrustHub
          SITE_INDEXING_ENABLED: false
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          SITE_INDEXING_ENABLED: false

  python:
    name: Ingestion lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingestion
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest

  database:
    name: Schema migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: investor_trust_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/investor_trust_hub
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate migration set
        run: python services/ingestion/scripts/apply_migrations.py --check-only
      - name: Apply migrations
        run: python services/ingestion/scripts/apply_migrations.py
      - name: Apply seed
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/seed/0001_source_registry.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/seed/0002_synthetic_fixtures.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/seed/0003_sec_adv_datasets.sql
      - name: Fixture publish is idempotent
        working-directory: services/ingestion
        run: |
          pip install -e ".[dev,db]"
          python -m ith_ingestion sec-adv ingest --fixture-dir fixtures/sec_adv --publish --archive-dir /tmp/ith-adv --report /tmp/ith-adv-1.json
          python -m ith_ingestion sec-adv ingest --fixture-dir fixtures/sec_adv --publish --archive-dir /tmp/ith-adv --report /tmp/ith-adv-2.json
          python - <<'PY'
          import json
          second = json.loads(open("/tmp/ith-adv-2.json", encoding="utf-8").read())
          assert second["already_published"] is True
          PY
      - name: Sanity queries
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM people WHERE is_synthetic;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM firms WHERE is_synthetic;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM form_adv_firm_facts;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT prospecting_prohibited FROM source_systems WHERE id = 'brokercheck';"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM firms WHERE slug LIKE 'sec-crd-90000000%';"
