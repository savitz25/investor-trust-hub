name: B1 Investor disposable migration preflight

on:
  pull_request:
    paths:
      - 'database/migrations/0016_b1_state_adviser_registration_type.sql'
      - 'database/rollback/0016_b1_state_adviser_registration_type.sql'
      - 'artifacts/th-enrich-b1-investor-execute.sql'
      - 'artifacts/th-enrich-b1-investor-rollback.sql'
      - 'artifacts/th-enrich-b1-disposable-live-schema.sql'
      - '.github/workflows/b1-investor-disposable-preflight.yml'

jobs:
  migration-rollback:
    if: github.event.pull_request.number == 66
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: b1_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/b1_disposable
    steps:
      - uses: actions/checkout@v5
      - name: Build disposable base schema and recreate inspected live registration table
        run: |
          for file in database/migrations/*.sql; do
            case "$file" in *0016_b1_state_adviser_registration_type.sql) break;; esac
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file" >/dev/null
          done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/seed/0001_source_registry.sql >/dev/null
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f artifacts/th-enrich-b1-disposable-live-schema.sql >/dev/null
      - name: Apply exact migration and 6,602-row execution packet
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/0016_b1_state_adviser_registration_type.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          DO $$ DECLARE typ text; fid uuid; BEGIN
            SELECT id INTO fid FROM firms LIMIT 1;
            FOREACH typ IN ARRAY ARRAY[
              'FL_NOTICE_FILED_SEC_RIA','FL_STATE_REGISTERED_IA',
              'FL_STATE_ERA_REPORTING','investment_adviser_representative',
              'FL_CURRENT_IAR','FL_APP_PEND_IARCE','STATE_REGISTERED_IA'
            ] LOOP
              INSERT INTO jurisdiction_registrations (
                subject_kind,firm_id,jurisdiction,registration_type,regulator_authority,
                regulator_authority_id,status,source_dataset_id,source_record_id,identity_confidence
              ) VALUES ('firm',fid,'CA',typ,'State securities regulator','state_securities',
                        'APPROVED','iapd_state_compilation','disposable:'||typ,'CONFIRMED');
            END LOOP;
          END $$;
          ROLLBACK;
          SQL
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f artifacts/th-enrich-b1-investor-execute.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF (SELECT count(*) FROM jurisdiction_registrations) <> 6603
               OR (SELECT count(*) FROM firms) <> 5942
               OR (SELECT count(*) FROM source_releases WHERE source_dataset_id='iapd_state_compilation') <> 1 THEN
              RAISE EXCEPTION 'disposable full load count failed';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM schema_migrations WHERE filename='0016_b1_state_adviser_registration_type.sql') THEN
              RAISE EXCEPTION 'migration not recorded';
            END IF;
          END $$;
          SQL
      - name: Prove rerun and uniqueness constraints
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f artifacts/th-enrich-b1-investor-execute.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ DECLARE f uuid; crd text; r jurisdiction_registrations%ROWTYPE; BEGIN
            IF (SELECT count(*) FROM jurisdiction_registrations) <> 6603 OR
               (SELECT count(*) FROM firms) <> 5942 THEN
              RAISE EXCEPTION 'rerun changed row counts';
            END IF;
            SELECT firm_id,identifier_value INTO f,crd FROM firm_identifiers WHERE identifier_type='SEC_CRD' LIMIT 1;
            BEGIN
              INSERT INTO firm_identifiers(firm_id,identifier_type,identifier_value,issuing_authority_id)
              VALUES (f,'crd',crd,'sec');
              RAISE EXCEPTION 'duplicate CRD accepted';
            EXCEPTION WHEN unique_violation THEN NULL; END;
            SELECT * INTO r FROM jurisdiction_registrations WHERE source_record_id LIKE 'B1-IAPD:%' LIMIT 1;
            BEGIN
              INSERT INTO jurisdiction_registrations(subject_kind,firm_id,jurisdiction,registration_type,
                regulator_authority,regulator_authority_id,status,source_dataset_id,source_record_id,identity_confidence)
              VALUES (r.subject_kind,r.firm_id,r.jurisdiction,r.registration_type,
                r.regulator_authority,r.regulator_authority_id,r.status,r.source_dataset_id,r.source_record_id,r.identity_confidence);
              RAISE EXCEPTION 'duplicate registration key accepted';
            EXCEPTION WHEN unique_violation THEN NULL; END;
          END $$;
          SQL
      - name: Prove production ownership drift and bounded rollback
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f artifacts/th-enrich-b1-investor-rollback.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO firms(slug,legal_name,display_name)
          VALUES ('sec-crd-8250','Disposable preexisting CRD 8250','Disposable preexisting CRD 8250');
          INSERT INTO firm_identifiers(firm_id,identifier_type,identifier_value,issuing_authority_id)
          SELECT id,'crd','8250','sec' FROM firms WHERE slug='sec-crd-8250';
          SQL
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f artifacts/th-enrich-b1-investor-execute.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f artifacts/th-enrich-b1-investor-execute.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF (SELECT count(*) FROM firms) <> 5942 OR
               (SELECT count(*) FROM jurisdiction_registrations) <> 6603 OR
               (SELECT notes::jsonb->>'created_firms' FROM source_releases
                WHERE source_dataset_id='iapd_state_compilation') <> '5490' THEN
              RAISE EXCEPTION 'drift execution or rerun failed';
            END IF;
          END $$;
          SQL
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f artifacts/th-enrich-b1-investor-rollback.sql
      - name: Roll back data and migration; verify the original schema and 451 existing firms
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/rollback/0016_b1_state_adviser_registration_type.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF (SELECT count(*) FROM jurisdiction_registrations) <> 1
               OR (SELECT count(*) FROM firms) <> 452
               OR (SELECT count(*) FROM firm_identifiers) <> 452
               OR (SELECT count(*) FROM source_releases WHERE source_dataset_id='iapd_state_compilation') <> 0 THEN
              RAISE EXCEPTION 'disposable rollback did not restore baseline';
            END IF;
            IF EXISTS (SELECT 1 FROM schema_migrations WHERE filename='0016_b1_state_adviser_registration_type.sql') THEN
              RAISE EXCEPTION 'rollback ledger still contains migration';
            END IF;
            IF EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conname='jurisdiction_registrations_registration_type_check'
              AND pg_get_constraintdef(oid) LIKE '%''STATE_REGISTERED_IA''::text%'
            ) THEN RAISE EXCEPTION 'new type still allowed'; END IF;
          END $$;
          SQL
